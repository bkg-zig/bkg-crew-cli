[package]
name = "bkgcrewcli"
version = "0.1.6"
edition = "2021"
description = "Unified CLI to run Claude Code, OpenCode, Codex, or Cursor from a single interface"
license = "MIT"
rust-version = "1.80"
repository = "https://github.com/bkg-zig/bkg-crew-cli.git"
homepage = "https://github.com/bkg-zig/bkg-crew-cli.git"
readme = "README.md"
keywords = ["cli", "ai", "agent", "claude", "codex"]
categories = ["command-line-utilities", "development-tools"]
exclude = ["docs/", "clidocs/", ".github/", "install.sh"]

[lib]
name = "bkgcrewcli"
path = "src/lib.rs"

[[bin]]
name = "bkgcrewcli"
path = "src/main.rs"

[dependencies]
async-trait = "0.1"
clap = { version = "4", features = ["derive"] }
dirs = "6"
futures = "0.3"
nix = { version = "0.29", features = ["signal", "process"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
thiserror = "2"
ureq = "3"
tokio = { version = "1", features = ["full"] }
tokio-stream = { version = "0.1", features = ["io-util"] }
tokio-util = { version = "0.7", features = ["rt"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
which = "7"
# Encrypted key storage
sqlx = { version = "0.8", features = ["runtime-tokio-rustls", "sqlite", "chrono", "uuid", "json"] }
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4", "serde"] }
# Encryption
aes-gcm = "0.10"
argon2 = "0.5"
rand = "0.9"
zeroize = "1.7"
# HTTP client for custom providers
reqwest = { version = "0.12", features = ["json", "rustls-tls", "stream"] }

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
tempfile = "3"
tokio-test = "0.4"

[profile.release]
lto = true
strip = true
codegen-units = 1
panic = "abort"

[lints.rust]
unsafe_code = "deny"
