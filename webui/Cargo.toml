[package]
name = "bkgcrewcli-webui"
version = "0.1.0"
edition = "2021"

[dependencies]
dioxus = { version = "0.6", features = ["web"] }
dioxus-web = "0.6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
gloo-net = "0.6"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = ["Window", "Document", "Storage"] }

[profile.release]
lto = true
opt-level = "z"
